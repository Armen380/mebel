<title>Կահույքի Գործարան</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@500;700;800;900&family=Noto+Sans:wght@500;700;800;900&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D world, HUD pinned to safe-area corners, menu + upgrades as walnut sheets docked to the bottom */
  --walnut:#2b1d14; --walnut-2:#3a281b; --walnut-3:#523a27;
  --honey:#f3b33d; --honey-d:#c4861a;
  --cream:#fbf1de; --muted:#cbb697;
  --leaf:#5cae4a; --leaf-d:#3d8a31; --danger:#d9573b;
  --sky:#bfe3f0;
  --display:"Noto Sans Armenian","Noto Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--cream);font-family:var(--display);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--honey);outline-offset:3px}

/* HUD */
.hud{position:fixed;inset:0;pointer-events:none}
.hud-top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.left{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.money{display:flex;align-items:center;gap:8px;background:var(--walnut);padding:5px 16px 5px 5px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.28);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;transition:transform .12s}
.money.bump{transform:scale(1.08)}
.coin{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--walnut);font-size:17px;font-weight:900;background:radial-gradient(circle at 35% 30%,#ffe7a3,var(--honey) 55%,var(--honey-d));box-shadow:inset 0 0 0 3px rgba(43,29,20,.15)}
.money{position:relative}
.mpop{position:absolute;left:100%;top:50%;margin-left:8px;display:flex;align-items:center;gap:5px;background:var(--leaf-d);color:#fff;font-size:13px;font-weight:900;padding:3px 10px 3px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:mpop 2.2s forwards;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.mpop svg{width:16px;height:16px}
@keyframes mpop{0%{opacity:0;transform:translate(-8px,-50%)}10%{opacity:1;transform:translate(0,-50%)}75%{opacity:1;transform:translate(0,-50%)}100%{opacity:0;transform:translate(0,-130%)}}
.level{display:flex;align-items:center;gap:8px;background:var(--walnut);padding:4px 12px 4px 4px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.lvnum{background:var(--leaf);color:#fff;font-weight:900;font-size:12px;padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.bar{width:74px;height:7px;border-radius:4px;background:var(--walnut-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.hud-right{display:flex;gap:8px;pointer-events:auto}
.btn-up{position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border-radius:14px;background:var(--honey);color:var(--walnut);font-weight:900;font-size:14px;box-shadow:0 4px 0 var(--honey-d)}
.btn-up:active{transform:translateY(2px);box-shadow:0 2px 0 var(--honey-d)}
.btn-up svg{width:22px;height:22px}
.btn-up.home{background:var(--cream);box-shadow:0 4px 0 var(--muted)}
.btn-up .badge{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--danger);border:2px solid var(--cream)}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--walnut);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.icon-btn svg{width:22px;height:22px}
.quest{position:absolute;top:calc(env(safe-area-inset-top,0px) + 108px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px;background:rgba(43,29,20,.86);padding:8px 14px 8px 8px;border-radius:14px;font-weight:700;font-size:14px;line-height:1.3}
.quest .step{flex:none;background:var(--leaf);color:#fff;font-weight:900;font-size:12px;padding:4px 8px;border-radius:9px;font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--walnut);opacity:.6;white-space:nowrap}
.throw{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 22px);pointer-events:auto;width:72px;height:72px;border-radius:50%;background:var(--walnut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.throw svg{width:26px;height:26px}
.throw:active{transform:translateY(2px)}
.toast{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(43,29,20,.92);padding:14px 22px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast b{display:block;font-size:26px;font-weight:900;color:var(--honey)}
.toast span{display:block;font-size:14px;font-weight:700;margin-top:4px}
.toast.show{animation:pop .3s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.7);opacity:0}}

/* world labels */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.chip{position:absolute;left:0;top:0;padding:3px 10px;border-radius:999px;background:rgba(43,29,20,.84);color:var(--cream);font:800 13px/1.3 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums;will-change:transform}
.chip span{opacity:.6;font-weight:700}
.chip.max{background:var(--danger);color:#fff;letter-spacing:.06em}
.chip.cash{background:var(--leaf-d);color:#fff}
.chip.bot{background:#1d6b7a;color:#e6fbff;font-size:11.5px;padding:2px 9px}
.chip.bot b{color:var(--honey)}
.chip.lvl{background:var(--honey);color:var(--walnut);font-weight:900;box-shadow:0 2px 0 var(--honey-d)}
.chip.pad{display:flex;flex-direction:column;align-items:center;background:var(--honey);color:var(--walnut);border-radius:11px;padding:4px 10px;line-height:1.2;box-shadow:0 2px 0 var(--honey-d)}
.chip.pad .pn{font-size:11px;font-weight:700;opacity:.85}
.chip.pad b{font-size:15px;font-weight:900}
.chip.locked{background:rgba(43,29,20,.72);text-align:center;line-height:1.3;border-radius:12px;padding:5px 12px}
.chip.locked b{color:var(--honey)}
.chip.bubble{background:#fff;color:var(--walnut);padding:5px 7px;border-radius:12px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.chip.bubble svg{width:24px;height:24px;display:block}
.float{position:absolute;left:0;top:0;font:900 20px var(--display);color:var(--honey);text-shadow:0 2px 0 var(--walnut),0 0 8px rgba(0,0,0,.25);white-space:nowrap;will-change:transform,opacity}

/* joystick */
.joy{position:fixed;left:0;top:0;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:50%;background:rgba(43,29,20,.22);border:3px solid rgba(255,255,255,.55);pointer-events:none}
.joy .knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.25)}

/* menu */
.menu{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;background:linear-gradient(to bottom,rgba(43,29,20,0) 35%,rgba(43,29,20,.5))}
.menu-card{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--walnut);border-radius:26px 26px 0 0;padding-block:22px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.kicker{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--honey);text-transform:uppercase}
.menu h1{margin:4px 0 6px;font-size:clamp(28px,7.5vw,40px);font-weight:900;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.menu h1 em{font-style:normal;color:var(--honey)}
.menu p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:46ch}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.skins{display:grid;grid-auto-flow:column;grid-auto-columns:92px;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.skins::-webkit-scrollbar{display:none}
.skin{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:16px;background:var(--walnut-2);border:3px solid transparent;font-size:12px;font-weight:700;line-height:1.2;text-align:center}
.skin.on{border-color:var(--honey);background:var(--walnut-3)}
.skin:disabled{opacity:.5;cursor:not-allowed}
.sw{width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--b) 0 35%,var(--a) 35% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
.skin .lock{font-size:10px;color:var(--honey);font-weight:800}
.actions{display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{height:56px;border-radius:16px;background:var(--honey);color:var(--walnut);font-weight:900;font-size:19px;box-shadow:0 5px 0 var(--honey-d)}
.primary:active{transform:translateY(3px);box-shadow:0 2px 0 var(--honey-d)}
.ghost{min-height:44px;padding:6px 10px;border-radius:14px;border:2px solid var(--walnut-3);color:var(--muted);font-weight:700;font-size:13px;line-height:1.25}
.ghost.warn{border-color:var(--danger);color:#ffb19f}
.menu-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.langs{display:flex;background:var(--walnut-2);border-radius:12px;padding:3px;gap:2px}
.langs button{min-width:44px;height:34px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--honey);color:var(--walnut)}
.unlock{position:absolute;top:calc(env(safe-area-inset-top,0px) + 160px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px;background:var(--cream);color:var(--walnut);padding:10px 18px 10px 10px;border-radius:18px;box-shadow:0 5px 0 var(--honey-d),0 10px 24px rgba(0,0,0,.25);border:3px solid var(--honey)}
.unlock.show{animation:slidein .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes slidein{from{transform:translate(-50%,-30px);opacity:0}}
.un-ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--honey);display:grid;place-items:center}
.un-ic svg{width:28px;height:28px}
.un-tx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.un-k{font-size:10.5px;font-weight:900;letter-spacing:.14em;color:var(--danger)}
.un-tx b{font-size:16px;font-weight:900}
.un-tx span:last-child{font-size:12.5px;font-weight:700;opacity:.75}
.controls{font-size:12px;color:var(--muted);text-align:center;opacity:.8}

/* upgrades sheet */
.sheet{position:fixed;inset:0;background:rgba(20,12,8,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{width:min(560px,100%);max-height:84%;display:flex;flex-direction:column;background:var(--walnut);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-head h2{margin:0;font-size:22px;font-weight:900}
.sheet-head .bal{font-size:14px;font-weight:800;color:var(--honey);font-variant-numeric:tabular-nums}
.sheet-body{overflow-y:auto;padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;background:var(--walnut-2);border-radius:12px;padding:10px 12px}
.note b{color:var(--honey)}
.grp{margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.up{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:16px;background:var(--walnut-2)}
.up>div{min-width:0}
.up h3{margin:0 0 2px;font-size:16px;font-weight:800}
.up .d{font-size:12.5px;color:var(--muted);line-height:1.4}
.up .v{margin-top:6px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--cream);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:6px;border-radius:2px;background:var(--walnut-3)}
.pips i.f{background:var(--leaf)}
.buy{min-width:96px;height:44px;padding:0 12px;border-radius:12px;background:var(--leaf);color:#fff;font-weight:900;font-size:15px;box-shadow:0 4px 0 var(--leaf-d);font-variant-numeric:tabular-nums;white-space:nowrap}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 var(--leaf-d)}
.buy:disabled{background:var(--walnut-3);color:var(--muted);box-shadow:none;cursor:not-allowed}
.buy.locked{font-size:12.5px;background:var(--walnut-3);color:var(--honey)}
.buy.maxed{background:transparent;color:var(--honey);box-shadow:none}

@media (prefers-reduced-motion:reduce){.money{transition:none}.toast.show,.unlock.show{animation:none}}
</style>

<div id="app"></div>
<div id="labels"></div>
<div class="joy" id="joy" hidden><div class="knob" id="knob"></div></div>

<div class="hud" id="hud" hidden>
  <div class="hud-top">
    <div class="left">
      <div class="money" id="moneyBox"><span class="coin">֏</span><b id="money">0</b></div>
      <div class="level"><span class="lvnum" id="lvNum">Lv 1</span><span class="bar"><i id="lvBar"></i></span></div>
    </div>
    <div class="hud-right">
      <button class="btn-up" id="btnUp" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M17 8v6M14 11h6"/></svg>
        <span data-i18n="ui.upgrade">Բարելավել</span><i class="badge" id="badge" hidden></i>
      </button>
      <button class="btn-up home" id="btnHome" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg><span data-i18n="ui.home">Տուն</span></button>
      <button class="icon-btn" id="btnMenu" type="button" aria-label="Մենյու" data-i18n-aria="ui.menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fbf1de" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>
      </button>
    </div>
  </div>
  <div class="quest" id="quest" hidden><span class="step" id="qStep">1/8</span><span id="qText"></span></div>
  <div class="hint" id="hint" data-i18n="ui.hint">Քաշիր էկրանի վրա կամ սեղմիր WASD</div>
  <button class="throw" id="btnThrow" type="button" hidden aria-label="Նետել ձեռքի իրերը" data-i18n-aria="ui.throwAria">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fbf1de" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>
    <span data-i18n="ui.throw">Նետել</span>
  </button>
  <div class="toast" id="toast" hidden><b id="toastT"></b><span id="toastS"></span></div>
  <div class="unlock" id="unlock" hidden role="status"><div class="un-ic" id="unIc"></div><div class="un-tx"><span class="un-k" data-i18n="un.new">ՆՈՐ</span><b id="unT"></b><span id="unS"></span></div></div>
</div>

<div class="menu" id="menu">
  <div class="menu-card">
    <div>
      <div class="menu-top"><div class="kicker" data-i18n="ui.kicker">Նախատիպ · v0.3</div>
        <div class="langs" role="group" aria-label="Language" id="langs">
          <button type="button" data-lang="hy">Հայ</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="ru">RU</button>
        </div></div>
      <h1 data-i18n-html="ui.h1">Կահույքի <em>Գործարան</em></h1>
      <p data-i18n="ui.intro">Կտրիր ծառեր, սղոցիր տախտակներ, պատրաստիր կահույք և վաճառիր։</p>
    </div>
    <div>
      <div class="label" data-i18n="ui.skin">Ընտրիր կերպարը</div>
      <div class="skins" id="skins"></div>
    </div>
    <div class="actions">
      <button class="primary" id="btnPlay" type="button">Սկսել</button>
      <div class="row2">
        <button class="ghost" id="btnTest" type="button" data-i18n="ui.test">Թեստ՝ +25 Lv, +250K ֏</button>
        <button class="ghost" id="btnReset" type="button">Նոր խաղ</button>
      </div>
    </div>
    <div class="controls" data-i18n="ui.controls">WASD կամ սլաքներ · Q՝ նետել · Հեռախոս՝ քաշիր մատով</div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-labelledby="upTitle">
    <div class="sheet-head">
      <div><h2 id="upTitle" data-i18n="ui.upTitle">Բարելավումներ</h2><div class="bal" id="bal"></div></div>
      <button class="icon-btn" id="btnClose" type="button" aria-label="Փակել" data-i18n-aria="ui.close">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fbf1de" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="upList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const V3=THREE.Vector3, PI=Math.PI;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const d2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
const lerpAng=(a,b,t)=>{let d=((b-a+PI)%(2*PI)+2*PI)%(2*PI)-PI;return a+d*t};
const hex=c=>'#'+c.toString(16).padStart(6,'0');
function fmt(n){n=Math.floor(n);if(n<1000)return ''+n;if(n<1e6)return (n/1e3).toFixed(n<1e4?1:0).replace('.0','')+'K';return (n/1e6).toFixed(n<1e7?2:1).replace(/\.?0+$/,'')+'M'}

/* ================= data ================= */
const PRODUCTS=[
 {id:'chair',   name:'Աթոռ',               sign:'ԱԹՈՌՆԵՐ',    inType:'plank',inN:2,time:2.6,price:500,  xp:3, unlock:1,  cost:0,      x:-2, wall:0xd9bf8c,roof:0x3f6f8a},

function signMesh(text,w,bg,fg){
  const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
  const tx=new THREE.CanvasTexture(c);tx.anisotropy=4;
  const draw=()=>{const s=typeof text==='function'?text():text;x.clearRect(0,0,512,128);
    x.fillStyle=bg;rr(x,4,4,504,120,26);x.fill();x.lineWidth=6;x.strokeStyle='rgba(255,255,255,.18)';x.stroke();
    x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';

    x.fillText(s,256,68);tx.needsUpdate=true};
  draw();TEXT_REDRAW.push(draw);const t=tx;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,w/4),new THREE.MeshBasicMaterial({map:t,transparent:true}));
  scene.add(m);return m;
}

}
function drawGround(g,label,glyph,tint,stroke){
  g.fillStyle=tint;rr(g,14,14,228,228,46);g.fill();
  if(stroke!==false){g.setLineDash([26,16]);g.lineWidth=10;g.strokeStyle='rgba(255,255,255,.95)';g.stroke();g.setLineDash([])}

  let gs=104;do{g.font=`900 ${gs}px ${FONT}`;gs-=4}while(g.measureText(glyph).width>180&&gs>40);

  let fs=30;do{g.font=`900 ${fs}px ${FONT}`;fs-=1}while(g.measureText(label).width>204&&fs>13);
  g.fillText(label,128,200);
}

function tryChop(a,node,dt,rate){

function updMachine(mc,dt){

  const b=mc.bld;if(b.pop<1){b.pop=Math.min(1,b.pop+dt*2.2);const k=b.pop;b.g.scale.setScalar(Math.max(.01,1+2.2*Math.pow(k-1,3)+1.2*Math.pow(k-1,2)))}

  b.fans.forEach(f=>f.rotation.y+=dt*(mc.busy?14:2.5));
  if(b.flag)b.flag.rotation.y=Math.sin(T*3)*.25;
  if(b.chimneys.length){b.smokeT-=dt*(mc.busy?1:.3)*(1+.2*b.s);if(b.smokeT<=0){b.smokeT=.45;b.chimneys.forEach(c=>puff(b.g.localToWorld(c.clone())))}}
  const slots=1+lvOf(mc.pad+'_qty'),time=mc.base/(1+.35*lvOf(mc.pad+'_speed'));
  if(!mc.busy){
    const room=Math.floor((mc.out.capFn()-mc.out.stack.n)/mc.outN);
    const k=Math.min(slots,Math.floor(mc.in.stack.items.length/mc.inN),room);
    if(k>=1){
      for(let i=0;i<k*mc.inN;i++){const m=mc.in.stack.pop();fly(m,()=>mc.mouth,.3+i*.02,()=>scene.remove(m),.5)}
      mc.busy=true;mc.t=0;mc.batch=k;
    }
  }else{
    mc.t+=dt;
    if(mc.t>=time){
      for(let i=0;i<mc.batch*mc.outN;i++){const m=makeItem(mc.outType);m.position.copy(mc.mouth);scene.add(m);sendTo(m,mc.out.stack,.35+i*.05)}
      mc.busy=false;
    }
  }
  if(mc.kind==='saw'){if(mc.busy)b.part.rotation.z-=dt*18}
  else b.part.rotation.x=mc.busy?Math.max(0,Math.sin(T*16))*.7:b.part.rotation.x*.9;
}

    else if(t.state==='in'){const sp=clamp((t.bay.x-x.x)*1.6,3,18);x.x=Math.min(t.bay.x,x.x+sp*dt);t.wh.forEach(w=>w.rotation.x-=sp*dt*2.6);if(x.x>=t.bay.x)t.state='park'}
    else if(t.state==='park'){x.z=Math.max(PARK,x.z-dt*3);if(x.z<=PARK){t.state='bay';t.t=0}}
    else if(t.state==='bay'){if(t.stack.items.length>=ORDER){t.t+=dt;if(t.t>.6){
      t.pay=0;t.xp=0;t.stack.items.forEach(m=>{const p=PROD[m.userData.type];t.pay+=Math.round(prodPrice(p)*ECON.truck);t.xp+=p.xp});
      t.state='unpark'}}}
    else if(t.state==='unpark'){x.z=Math.min(LANE,x.z+dt*3);if(x.z>=LANE){t.state='out';t.v=0;t.bay.truck=null;t.bay=null}}
    else if(t.state==='out'){t.v=Math.min(18,t.v+dt*9);x.x+=t.v*dt;t.wh.forEach(w=>w.rotation.x-=t.v*dt*2.6);
      if(x.x>80){t.state='away';t.t=10;t.g.visible=false;t.stack.items.forEach(m=>t.stack.anchor.remove(m));t.stack.items=[];
        addMoney(t.pay);addXP(t.xp);moneyPop(t.pay)}}
  }
}

let AC=null,lastCoin=0;
function sfx(k){
  if(!AC)return;const now=AC.currentTime;if(k==='coin'){if(now-lastCoin<.05)return;lastCoin=now}
  const o=AC.createOscillator(),g=AC.createGain(),f={coin:900,chop:170,quest:620,buy:700,throw:260,level:520}[k]||440;
  o.type=k==='chop'?'square':'triangle';o.frequency.setValueAtTime(f,now);
  if(k==='throw')o.frequency.exponentialRampToValueAtTime(f*.5,now+.15);else if(k!=='chop')o.frequency.exponentialRampToValueAtTime(f*1.5,now+.09);
  g.gain.setValueAtTime(k==='chop'?.035:.06,now);g.gain.exponentialRampToValueAtTime(.0001,now+(k==='quest'||k==='level'?.35:.15));
  o.connect(g).connect(AC.destination);o.start(now);o.stop(now+.4);
}

  {const tw=shopW();SHOP.cur+=(tw-SHOP.cur)*Math.min(1,dt*3);if(Math.abs(tw-SHOP.cur)>.005)layoutShop(SHOP.cur)}

}
function updUnlock(dt){
  if(unCur){unT-=dt;if(unT<=0){unCur=null;$('#unlock').hidden=true}return}
  if(!unQ.length||mode!=='play')return;
  unCur=unQ.shift();unT=4.6;
  const [a,b]=unCur.build();
  $('#unIc').innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="#2b1d14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${UN_ICON[unCur.ic]}</svg>`;
  $('#unT').textContent=a;$('#unS').textContent=b;
  const el=$('#unlock');el.hidden=false;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
  if(unCur.target)guide={pos:unCur.target,until:T+12};sfx('quest');
}
let lastSkinCheck=0;

/* ================= language ================= */
let playKey='ui.play';
function applyLang(){
  document.documentElement.lang=LANG;document.title=t('ui.title');
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
  document.querySelectorAll('#langs [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));
  $('#btnPlay').textContent=t(playKey);resetArm();renderSkins();renderQuest();
  if(!$('#sheet').hidden)renderShop();
  TEXT_REDRAW.forEach(f=>f());
}
function setLang(l){
  if(!I18N[l])return;LANG=l;S.lang=l;save();applyLang();
  try{document.fonts.load(`900 40px ${FONT}`,'ԱաAaЯяЖж').then(()=>TEXT_REDRAW.forEach(f=>f()))}catch(_){}
}
$('#langs').addEventListener('click',e=>{const b=e.target.closest('[data-lang]');if(b)setLang(b.dataset.lang)});

/* ================= boot ================= */
(async function boot(){
  try{await Promise.race([document.fonts.load(`900 40px ${FONT}`,'ԱաAaЯяЖж'),new Promise(r=>setTimeout(r,1600))])}catch(_){}
  buildWorld();SHOP.cur=shopW();layoutShop(SHOP.cur);machines.forEach(mc=>refreshBuilding(mc.pad,false));setupLabels();
  for(let i=0;i<S.lv.lumber;i++)spawnWorker('lumber');
  for(const k of['carrier','robot','miner','secCarrier',...SHOP_STAFF])for(let i=0;i<S.lv[k];i++)spawnWorker(k);
  for(let i=0;i<lvOf('truck');i++)makeTruck();
  if(hadSave)playKey='ui.continue';
  checkUnlocks(true);applyLang();
  renderSkins();hudMoney(true);hudLevel();
  camera.position.set(P.pos.x,1.7,P.pos.z+6);camLook.copy(P.pos);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  requestAnimationFrame(t=>{last=t;frame(t)});
})();
})();
</script>
